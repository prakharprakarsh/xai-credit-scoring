name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -r requirements.txt
      - name: Tests (excluding fairness gate)
        run: pytest -q --ignore=tests/test_fairness.py --cov=src --cov-report=term-missing
      - name: Fairness gate (fails on any blocking violation)
        run: pytest -q tests/test_fairness.py
