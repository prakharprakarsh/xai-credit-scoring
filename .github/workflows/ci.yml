name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      # pinned: the fairness numbers move with the xgboost version (see README)
      - run: pip install -r requirements.lock.txt
      - name: Tests (excluding fairness gate)
        run: pytest -q --ignore=tests/test_fairness.py --cov=src --cov-report=term-missing
      - name: Fairness gate (fails on any blocking violation)
        run: pytest -q tests/test_fairness.py
